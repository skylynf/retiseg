# Trial design (docs/clinical/28 section 5; docs/clinical/31 meeting of 2026-10-29): 10-20 images read first by
# Dr. Peranut Chotcomwongse to test the questions and the tool; the formal batch (batch01.yaml, draft) is fixed after
# this feedback. Frozen and committed before the pack is built; never edited after the reader opens the pack
# (a change makes trial02.yaml).
# Model under review: RetiSeg-Ref (bench/reference.py; docs/paper/14 note 58), release thresholds (validation-optimal
# on the DDR validation split). Consensus feature (zoo_frac): the 18 registered DDR-trained models, seed 0.
# Candidates are written by mine_discrepancies.py on the server (docs/ops/17 section 4 item 72).
# MAPLES-DR is left out of the trial (MESSIDOR terms, docs/clinical/28 section 3); it can join the formal batch.
# Expected size: 15 images, about 45 representative + 10 enriched regions, about one hour of reading.
name: trial01
seed: 20261029
sets:
  - {set: DDR,      candidates: runs/CLINREV/mine/RetiSeg-Ref/DDR,      reference_grade_scale: "ICDR 0-4 (DDR release)"}
  - {set: IDRiD,    candidates: runs/CLINREV/mine/RetiSeg-Ref/IDRiD,    reference_grade_scale: null}
  - {set: TJDR_std, candidates: runs/CLINREV/mine/RetiSeg-Ref/TJDR_std, reference_grade_scale: null}
  - {set: TJDR_uwf, candidates: runs/CLINREV/mine/RetiSeg-Ref/TJDR_uwf, reference_grade_scale: null}
images:
  eligibility: {FN: 1, FP: 1, agree: 1}
  strata:
    - {set: DDR, grade_band: "0-1", n: 3, eligibility: {}}      # mild images: one AI-only MA can move No DR -> mild
    - {set: DDR, grade_band: "2-4", n: 5}
    - {set: IDRiD, n: 3}
    - {set: TJDR_std, n: 2}
    - {set: TJDR_uwf, n: 2}                                      # peripheral lesions: the label-omission question
representative:
  per_image:
    - {kind: FN, n: 1}
    - {kind: FP, n: 1}
    - {kind: agree, n: 1}
enriched:
  - {name: confident_fp, kind: FP, n: 3, where: {prob_max_ge: 0.9}}
  - {name: confident_fn, kind: FN, n: 3, where: {prob_max_le: 0.1, size_bin: [medium, large]}}
  - {name: confusion, n: 2, where: {subtype_prefix: confusion}}
  - {name: consensus_fp, kind: FP, n: 2, where: {zoo_frac_ge: 0.8}}
geometry:
  crop_min: 384
  crop_margin: 0.6
  marker_min_radius: 14
  marker_pad: 6
  min_gap: 0
max_per_image: 5
