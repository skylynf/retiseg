# bench/tests and the paper's collect test on every push and pull request, with CPU torch
# (docs/ops/21 item 29 b, agreed by Luming on 2026-10-14). Submodules are checked out shallowly
# because the wrapper and recipe tests read the official code; datasets, weights and runs/ are not
# on the runner, so the tests that need them skip (docs/ops/21 item 2) and test_h2former_forward.py,
# which builds H2Former at 960 pixels (3 GB), is left out. The first runs show what else needs a
# skip marker; failures are recorded in docs/ops/21, never fixed by loosening a test.
name: tests

on:
  push:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch and the training requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/requirements-train.txt
          pip install pandas matplotlib
      - name: bench/tests (includes the paper's collect test through test_collect_runs_paper.py)
        run: python -m pytest bench/tests -q -p no:cacheprovider --ignore=bench/tests/test_h2former_forward.py
