# Model registry. One entry per model variant that enters any table.
# repro_level: R0 no code | R1 model definition only | R2 inference code + weights
#              R3 training code | R4 training code + weights + splits + environment
# track: A original weights | B unified retraining of official code | C re-implementation from the paper
# tier: 1 main table | 2 if time allows | 3 paper audit only
# Status as of the 2026-10-02 code audit (literature/synthesis/04_*.txt); update after author replies.

general:
  - {name: U-Net,       repo: null,                                      repro_level: R3, tracks: [B], tier: 1, notes: "no author repo; use a reference PyTorch implementation"}
  - {name: DeepLabv3,   repo: official_code/DeepLabv3plus,               repro_level: R3, tracks: [B], tier: 1, notes: "registered name is DeepLabv3. torchvision deeplabv3_resnet101 is ASPP plus bilinear upsampling, not the DeepLabv3+ decoder. The TensorFlow repo is the paper code and is not the B1 network."}
  - {name: HRNet,       repo: official_code/HRNet-Semantic-Segmentation, repro_level: R3, tracks: [B], tier: 1}
  - {name: nnU-Net,     repo: official_code/nnUNet,                     repro_level: R4, tracks: [B], tier: 1, notes: "shallow clone 2026-10-04; train entry nnunetv2/run/run_training.py"}
  - {name: Swin-Unet,   repo: official_code/Swin-Unet,                   repro_level: R3, tracks: [B], tier: 1}
  - {name: FCT,         repo: official_code/FCT,                         repro_level: R3, tracks: [B], tier: 1, notes: "official PyTorch port in PyTorch/main.py, not the TensorFlow entry. B1 adaptation widens the stem to 3 channels, assigns the four head channels to MA HE EX SE, and sets forward_size 384."}
  - {name: H2Former,    repo: official_code/H2Former,                    repro_level: R3, tracks: [B], tier: 1, notes: "general medical segmentation model used on several organs. Not a DR-specific method. B1 uses idrid_train.py for both IDRiD and DDR."}
  - {name: UNet++,      repo: official_code/Nested-UNet,                 repro_level: R3, tracks: [B], tier: 2}
  - {name: UPerNet,     repo: official_code/UPerNet,                     repro_level: R3, tracks: [B], tier: 2}

fundus_multiscale:
