# The server's one queue (bench/scripts/launch_queue.py; docs/ops/17 section 14).
# Lower priority runs first; inside a stage the stage's own order holds (E3a: tier, then cost;
# B-std jobs: seed 0 longest first, then its test maps, then the other seeds; factor cells:
# longest first). The launcher reads this file again every time one of its cards is free,
# so reordering is an edit and a commit, never a kill. Finished and running items are left
# out by each stage's own markers; a stage whose inputs are missing (weights, converted
# data, an environment) is reported and skipped until they exist. max_concurrent caps how
# many items of a stage this launcher runs at once; the next stage gets the card.
#
# Priorities on 2026-10-14, second edit (docs/ops/17 section 16: seed 0 of everything the
# paper's tables need first, the inference tiers next, the expensive factor cells after,
# seeds 1-2 last; multi-seed only adds error bars, so the writing starts on seed 0).
stages:
  # 1. Independent tests of every finished checkpoint (R4, figure 6): inference only, short items.
  #    Two cards at most, so training starts on the other cards today. MAPLES-DR joins by itself
  #    once dataset/prepared/MAPLES-DR exists (17 section 16.2).
  - name: e3a
    priority: 10
    kind: e3a
    max_concurrent: 2
    drop_maps: [FGADR, Retinal-Lesions]

  # 2. E5 training tiers, seed 0 (R3, table 3): the longest runs, started first.
  - name: e5_seed0
    priority: 20
    kind: bs
    jobs: bench/configs/bs_jobs.yaml
    only: [SAMed, SAM-Adapter, SAM2-UNet, RETFound]   # MedSAM joins when pretrained/medsam_vit_b.pth exists
    seed0_only: true

  # 3. Fundus-specific expansion, seed 0 (docs/paper/18; main table rows). Enable after the smoke (17 section 15.3).
  - name: fundus_seed0
    priority: 25
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [HRDecoder, PMCNet, WSRFNet, CLC-Net, TC-Net]
    seed0_only: true

  # 4. E5 inference tiers (17 section 6): zero-shot and oracle-prompt rows of table 3. Inference only;
  #    DDR val first (its maps choose the Dice thresholds of every test set). more_masks and G2 are cut
  #    (docs/paper/16 section 8, the offset for the fundus expansion).
  #    OFF 2026-10-14 (Liuyc05): these three stages still run SAM ViT-H for the oracle tier, k = 10 and the
  #    authors' 32-point generator, which docs/paper/16 rows E5a/E5b do not allow (ViT-B, k in {1, 5, 20, all},
  #    grid {64, 128} x caps {0.5%, 2%, 100%}). The albert branch carries an implementation of the 16 scope;
  #    leave these off until that merge lands (docs/ops/25). Nothing has been decoded yet, so no result is lost.
  - name: e5_amg
    priority: 28
    kind: e5_amg
    enabled: false
    env: retiseg
    max_concurrent: 1
    models: [sam, sam2]
    generators: [default]
    sets: [DDR:val, IDRiD, DDR, TJDR_std, FGADR, Retinal-Lesions, DiaRetDB1, TJDR_uwf, MAPLES-DR]

  - name: e5_prompted
    priority: 29
    kind: e5_prompted
    enabled: false
    env: retiseg
    max_concurrent: 1
    models: [sam2, sam]        # medsam joins when its weights exist; points are SAM 2 only (docs/paper/16)
    kinds: [box]
    k: 1,5,10,20,all
    sets: [DDR:val, IDRiD, DDR, TJDR_std, FGADR, Retinal-Lesions, DiaRetDB1, TJDR_uwf, MAPLES-DR]

  - name: e5_prompted_points
    priority: 30
    kind: e5_prompted
    enabled: false
    env: retiseg
    max_concurrent: 1
    models: [sam2]
    kinds: [point]
    k: 1,5,10,20,all
    sets: [DDR:val, IDRiD, DDR, TJDR_std, FGADR, Retinal-Lesions, DiaRetDB1, TJDR_uwf, MAPLES-DR]

  # 5. Factor cells that need no new weights (R5, figure 7): U-Net and M2MRF rows of E3b/E4/E8/E9 and
  #    M2MRF's E7. The old launch_factor process is finishing these; this stage only picks up what
  #    it leaves (its running directories are skipped by console.log).
  - name: factor_cheap
    priority: 32
    kind: factor
    models: [U-Net, M2MRF]

  # 6. nnU-Net trained on TJDR_std and FGADR (the fifth E3b model; needs the converted raw data, 17 section 13.1c).
  - name: nnunet_e3b
    priority: 40
    kind: nnunet
    runs:
      - {train: TJDR_std, plan: default}
      - {train: FGADR, plan: default}

  # 7. Expensive factor cells: SAM2-UNet and RETFound trained on TJDR_std / FGADR (E3b, 4 cells, ~76 h),
  #    then RETFound's resolution cells (E7, 2 cells, ~79 h).
  - name: factor_e3b_heavy
    priority: 45
    kind: factor
    experiment: E3b
    models: [SAM2-UNet, RETFound]

  - name: factor_e7_heavy
    priority: 55
    kind: factor
    experiment: E7
    models: [SAM2-UNet, RETFound]

  # Cut 2026-10-14 (docs/paper/16 section 8); kept here so the plan shows it as off.
  - name: e5_amg_g2
    priority: 58
    kind: e5_amg
    enabled: false
    env: retiseg
    models: [sam, sam2]
    generators: [default]
    geometry: G2
    sets: [DDR:val, IDRiD, DDR]

  # 8. Seeds 1 and 2 (error bars only; the text is written on seed 0). Enable in this order once
  #    every seed-0 stage above has nothing pending: HRDecoder (the backbone-controlled comparison),
  #    SAM2-UNet and RETFound, then the other fundus models.
  - name: hrdecoder_rest
    priority: 60
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [HRDecoder]

  - name: e5_rest
    priority: 70
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [SAM2-UNet, RETFound]

  - name: fundus_rest
    priority: 75
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [PMCNet, WSRFNet, CLC-Net, TC-Net]

  - name: e1r
    priority: 90
    kind: shell
    enabled: false
    env: retiseg
    items: []   # filled from 17 section 7 when the cards are free
