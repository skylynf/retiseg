# The server's one queue (bench/scripts/launch_queue.py; docs/ops/17 section 14).
# Lower priority runs first; inside a stage the stage's own order holds (E3a: tier, then cost;
# B-std jobs: seed 0 longest first, then its test maps, then the other seeds; factor cells:
# longest first). The launcher reads this file again every time one of its cards is free,
# so reordering is an edit and a commit, never a kill. Finished and running items are left
# out by each stage's own markers; a stage whose inputs are missing (weights, converted
# data, an environment) is reported and skipped until they exist. max_concurrent caps how
# many items of a stage this launcher runs at once; the next stage gets the card.
#
# Priorities on 2026-10-14, second edit (docs/ops/17 section 16: seed 0 of everything the
# paper's tables need first, the inference tiers next, the expensive factor cells after,
# seeds 1-2 last; multi-seed only adds error bars, so the writing starts on seed 0).
# Third edit 2026-10-15 (docs/ops/17 section 4, after the server's first day): the E3a stage
# keeps seed-0 sources only and the seed-1/2 sources move to e3a_rest behind the training
# stages; the E5 inference pool (one card, about a day) moves ahead of the E5 training so
# table 6 is not a week behind table 3. One launcher for all six project cards
# (RETISEG_GPUS="2 3 4 5 6 7"): cards 4 and 6 join when their E5 seed-0 runs end.
stages:
  # 1. Independent tests of every finished seed-0 checkpoint (R4, figure 6): inference only, short items.
  #    Two cards at most, so training runs on the other cards. MAPLES-DR joined by itself once
  #    dataset/prepared/MAPLES-DR existed (2026-10-14). B-std seeds 1 and 2 are in e3a_rest.
  - name: e3a
    priority: 10
    kind: e3a
    max_concurrent: 2
    seed0_only: true
    drop_maps: [FGADR, Retinal-Lesions]

  # 1b. E5 inference pool (docs/ops/17 section 7): IDRiD and DDR validation, 22 items, one card.
  #     ON once the inference smoke has passed, runs/E5 is clean and the launcher runs this code;
  #     the selections (`--select`, committed into e5_frozen.yaml) then unlock e5_infer_test below.
  - name: e5_infer_pool
    priority: 15
    kind: e5_infer
    enabled: false
    phase: pool
    max_concurrent: 1

  # 2. E5 training tiers, seed 0 (R3, table 3): the longest runs, started first.
  - name: e5_seed0
    priority: 20
    kind: bs
    jobs: bench/configs/bs_jobs.yaml
    only: [SAMed, SAM-Adapter, SAM2-UNet, RETFound]   # MedSAM joins when pretrained/medsam_vit_b.pth exists
    seed0_only: true

  # 3. Fundus-specific expansion, seed 0 (docs/paper/18; main table rows). ON since the smoke of 2026-10-15 (17 section 8).
  - name: fundus_seed0
    priority: 25
    kind: bs
    enabled: true
    jobs: bench/configs/bs_jobs.yaml
    only: [HRDecoder, PMCNet, WSRFNet, CLC-Net, TC-Net]
    seed0_only: true

  # 4. E5 inference tiers on the test sets (docs/ops/17 section 7; docs/ops/25, the albert merge):
  #    zero-shot and oracle-prompt rows of table 6. Lists nothing until `python -m bench.e5.amg --select`
  #    and `python -m bench.e5.sam3_text --select` have filled e5_frozen.yaml (committed). Each test item
  #    waits for its own source's pool directories (gate). Decisions D1-D9 and the budget rule were
  #    confirmed on 2026-10-14 (docs/ops/00). ON once the selections are committed; max_concurrent is
  #    revisited by the workstation after `launch_e5_infer.py --estimate` (the test tier is the large one).
  - name: e5_infer_test
    priority: 29
    kind: e5_infer
    enabled: false
    phase: test
    max_concurrent: 1
    drop_maps: [FGADR, Retinal-Lesions]

  # 5. Factor cells that need no new weights (R5, figure 7): U-Net and M2MRF rows of E3b/E4/E8/E9 and
  #    M2MRF's E7. The old launch_factor process is finishing these; this stage only picks up what
  #    it leaves (its running directories are skipped by console.log).
  - name: factor_cheap
    priority: 32
    kind: factor
    models: [U-Net, M2MRF]

  # 6. nnU-Net trained on TJDR_std and FGADR (the fifth E3b model; needs the converted raw data, 17 section 13.1c).
  - name: nnunet_e3b
    priority: 40
    kind: nnunet
    runs:
      - {train: TJDR_std, plan: default}
      - {train: FGADR, plan: default}

  # 7. Expensive factor cells: SAM2-UNet and RETFound trained on TJDR_std / FGADR (E3b, 4 cells, ~76 h),
  #    then RETFound's resolution cells (E7, 2 cells, ~79 h).
  - name: factor_e3b_heavy
    priority: 45
    kind: factor
    experiment: E3b
    models: [SAM2-UNet, RETFound]

  - name: factor_e7_heavy
    priority: 55
    kind: factor
    experiment: E7
    models: [SAM2-UNet, RETFound]

  # 8. Independent tests of the B-std seed-1/2 checkpoints (error bars of R4 / figure 6): behind every
  #    training stage, so the two E3a cards go to training once the seed-0 sources are done.
  - name: e3a_rest
    priority: 58
    kind: e3a
    max_concurrent: 2
    drop_maps: [FGADR, Retinal-Lesions]

  # 9. Seeds 1 and 2 of the training (error bars only; the text is written on seed 0). Enable in this
  #    order once every seed-0 stage above has nothing pending: HRDecoder (the backbone-controlled
  #    comparison), SAM2-UNet and RETFound, then the other fundus models.
  - name: hrdecoder_rest
    priority: 60
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [HRDecoder]

  - name: e5_rest
    priority: 70
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [SAM2-UNet, RETFound]

  - name: fundus_rest
    priority: 75
    kind: bs
    enabled: false
    jobs: bench/configs/bs_jobs.yaml
    only: [PMCNet, WSRFNet, CLC-Net, TC-Net]

  - name: e1r
    priority: 90
    kind: shell
    enabled: false
    env: retiseg
    items: []   # filled from 17 section 7 when the cards are free
