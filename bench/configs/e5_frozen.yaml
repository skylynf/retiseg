# E5, foundation models under four kinds of use (docs/design/15). Written 2026-10-12, before any E5
# training or inference. The two trained settings (c, d) follow bench/configs/bs_frozen.yaml like
# every B-std model and are rows of bench/configs/bs_jobs.yaml; this file holds what is E5's own.
# Nothing here changes after the first E5 test metric has been read; the fields marked "filled
# from validation" are written once, from training and validation data only, before any test run.
# 2026-10-12 (step 0, workstation albert): the inference tiers (a, b) were aligned with docs/paper/16 rows E5a-E5b
# before any E5 inference (decisions D1-D9, docs/ops/00 same day): a registered grid chosen on a validation pool
# instead of the authors' two parameter sets, SAM ViT-B for the oracle tier, k on four levels, points for SAM 2.1
# only, the TJDR_uwf canvas of the inference tiers, and how the class-agnostic map is stored.
experiment: E5

# design/15 section 16; the user delegated all five to the recommendations on 2026-10-12.
decisions:
  matmul_tf32: true                  # E5 training and its inference (wrapper attribute matmul_tf32)
  tf32_check: SAM2-UNet IDRiD seed 0 with and without (extra_jobs.yaml, experiment E5tf32)
  retfound_weights: RETFound_mae_natureCFP   # Retinal-Lesions and FGADR columns footnoted (EyePACS)
  code_over_paper: true              # SAM-Adapter batch 2 and unloaded prompt tensors; SAM2-UNet mean BCE
  collapse_rule: same_as_unet        # a class stuck at its prevalence in seed-0 validation -> batch Dice/IoU
  encoder_comparison: full           # five encoders, three learning rates on DDR seed 0, three seeds; cut augreg first
  inference_scope: docs/paper/16 E5a-E5b   # 2026-10-12, D1-D9: grid on the validation pool, SAM ViT-B for b, k four levels, points SAM 2.1 only

# pretrained/<file>. A missing file stops the job before its first step (bench/models/foundation.py).
weights:
  sam_vit_h_4b8939.pth: {source: "https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth", used_by: [SAM a, SAM-Adapter]}
  sam_vit_b_01ec64.pth: {source: "https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth", used_by: [SAMed, SAM b]}
  sam2.1_hiera_large.pt: {source: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt", used_by: [SAM 2 a, SAM 2 b]}
  sam2_hiera_large.pt: {source: "https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_large.pt", used_by: [SAM2-UNet]}
  medsam_vit_b.pth: {source: "MedSAM README, Google Drive folder 1ETWmi4AiniJeWOt6HAsYgTjYv_fkgzoN", used_by: [MedSAM b, MedSAM d]}
  sam3.pt: {source: "huggingface.co/facebook/sam3 (gated)", sha256: 9999e2341ceef5e136daa386eecb55cb414446a00ac2b55eb2dfd2f7c3cf8c9e, used_by: [SAM 3 a]}
  RETFound_mae_natureCFP.pth: {source: "huggingface.co/YukunZhou/RETFound_mae_natureCFP (gated)", sha256: e1e4f66a1b792eeb6e2efaf158f33be35c8255f36b3d17ed67cd5129da246485, used_by: [RETFound d, encoder comparison]}
  RETFound_dinov2_meh.pth: {source: "huggingface.co/YukunZhou/RETFound_dinov2_meh (gated)", sha256: a3feeaf69b44a0baa0934162d06b11ca517d1ca71a8459e04ef72c287d4e7124, used_by: [encoder comparison]}
  mae_pretrain_vit_large.pth: {source: "https://dl.fbaipublicfiles.com/mae/pretrain/mae_pretrain_vit_large.pth", used_by: [encoder comparison]}
  timm: [vit_large_patch14_dinov2.lvd142m, vit_large_patch16_224.augreg_in21k_ft_in1k]   # hub cache or pretrained/<arch>.safetensors

trained:
  models: [SAMed, SAM-Adapter, SAM2-UNet, MedSAM, RETFound]
  windows: {SAMed: 512, SAM-Adapter: 1024, MedSAM: 1024, RETFound: 224, SAM2-UNet: "960 patches, whole canvas"}

encoder_comparison:
  dataset: DDR
  head: "RETFound's UPerNet head and recipe (bench/models/vit_upernet.py)"
  encoders:
    RETFound: retfound_mae
    ViT-UPerNet MAE-IN1k: mae_in1k
    ViT-UPerNet RETFound-DINOv2: retfound_dinov2
    ViT-UPerNet DINOv2: dinov2
    ViT-UPerNet augreg: augreg
  lr_scales: [0.3333333333333333, 1.0, 3.0]     # RETFound x1 is the main-table DDR seed 0
  select_by: highest validation mAUPR of the seed-0 run
  seeds: 3
  lr_choice: {}                      # filled from validation after the seed-0 sweep

# D2 (2026-10-12, docs/ops/17 section 6): every label-based choice of the inference tiers (the generator grid,
# the SAM 3 phrase, the Dice thresholds) is made on this pool and nowhere else; no test split is read for it.
validation_pool:
  IDRiD: {data: dataset/prepared/IDRiD, split: val}    # 10 images
  DDR: {data: dataset/prepared/DDR, split: val}        # 149 images
  thresholds: "per class, the Dice-optimal threshold of the pooled pixel histograms of both splits (bench/eval/pixel.best_dice_threshold); fixed 0.5 is reported as well"

# a, zero-shot. Inference only; all seven test sets and the validation pool.
geometry:
  G1: {name: canvas windows, window: {SAM: 1024, SAM 2: 1024, MedSAM: 1024, SAM 3: 1008}, overlap: 0.5,
       TJDR_uwf: {long_side: 4256, reference: "1440 x 133 / 45: the DDR field of e3a_frozen.yaml train_field_degrees; the inference tiers have no training source, so 45 degrees is fixed here (D7, 2026-10-12), the same canvas as the DDR-trained models in E3a",
                  comparison_variant: {fov: 1440}}}
  G2: {name: whole field-of-view crop, resize: model default}
  main: G1
zero_shot:
  # D1 (docs/paper/16 row E5a, 2026-10-12): a registered grid replaces the authors' two parameter sets.
  # points_per_side is the only generator parameter that varies; everything else is the library default
  # of the fixed commit. Each density is one inference pass; the area caps are post-processing of the
  # same masks. Per model (2026-10-12, review fix 7: SAM and SAM 2.1 are selected separately, their
  # generators' default thresholds differ), the pair (points_per_side, area_cap_fraction) is chosen on the
  # validation pool by the any-lesion AUPR of the pixel histograms pooled over both pool sets and written
  # to `selected`; the seven test sets see each model's selected pair only, the pool reports all six pairs
  # (sensitivity). Nothing is tuned on a test split.
  grid:
    points_per_side: [64, 128]
    area_cap_fraction: [0.005, 0.02, 1.0]     # of the canvas field-of-view area; 1.0 = no cap
    select_on: validation_pool
    select_by: AUPR_any_lesion
    select_rule: "per model: the pair with the highest any-lesion AUPR on the pixel histograms pooled over both pool sets (python -m bench.e5.amg --select; the two sets are pooled by pixel, so DDR's 149 images outweigh IDRiD's 10); ties go to the lower density, then to the larger cap (registered 2026-10-12 before any pool run); the selection is written once (runs/E5/selection_grid.json) and --select refuses to run while selected is filled"
    selected: {}                              # {SAM: {points_per_side, area_cap_fraction}, SAM 2: {...}} filled from the pool before any test run
    budget_rule: "if 128 is selected for a model, that model's TJDR_uwf runs its fov variant (1440 canvas) only and its per-degree main variant is skipped (registered 2026-10-12; the user may overrule it in 00 once the pool result is in)"
  sam:
    checkpoint: sam_vit_h_4b8939.pth
    generator_defaults: {pred_iou_thresh: 0.88, stability_score_thresh: 0.95, box_nms_thresh: 0.7,
                         crop_n_layers: 0, min_mask_region_area: 0}   # segment_anything/automatic_mask_generator.py:39-50
  sam2:
    checkpoint: sam2.1_hiera_large.pt
    generator_defaults: {pred_iou_thresh: 0.8, stability_score_thresh: 0.95, mask_threshold: 0.0,
                         box_nms_thresh: 0.7, use_m2m: false, multimask_output: true}   # sam2/automatic_mask_generator.py:40-55
  pixel_score: predicted_iou          # stability_score reported as well
  # D8: the class-agnostic map is written to all four class directories, so bench.eval's AUPR_any_lesion
  # (max of the four) is that map's pooled AUPR; the per-class AUPRs of that directory are the
  # "no class assignment" reference, not a result. oracle_class writes four different maps (reads the
  # test labels: upper bound only). area_cap is the same masks after the cap.
  outputs: {main: any_lesion, upper_bound: oracle_class, sensitivity: area_cap}
  # Recorded statistic only (main 3d00468, python -m bench.e5 areacap of main's earlier implementation, 2026-10-14):
  # the largest training lesion component on the 1440 canvas is 244004 pixels (DDR 007-6562-400, HE), about 15% of a
  # field of view. The caps of this protocol are fractions of the field of view (grid.area_cap_fraction); this number
  # is not used by any run (merge of albert, docs/ops/25).
  sam3:
    checkpoint: sam3.pt
    confidence_threshold: 0.0         # keep all 200 queries; the processor default 0.5 cuts the PR curve
    pixel_score: max over queries of query score x mask probability
    phrases:
      MA: [microaneurysm, red dot, small red lesion]
      HE: [retinal hemorrhage, blot hemorrhage, dark red patch]
      EX: [hard exudate, yellow deposit, bright lesion]
      SE: [cotton wool spot, soft exudate, white fluffy patch]
    select_on: validation_pool (D2), AUPR per class
    selected: {}                      # filled from the validation pool before any test run

# b, oracle prompts from the test labels: an upper bound, never ranked with the trained rows.
# D3-D6 (docs/paper/16 row E5b, 2026-10-12): SAM ViT-B boxes only, SAM 2.1 points and boxes, MedSAM boxes;
# k on four levels; one sampling; k = all on all seven test sets, the k curves on IDRiD and DDR only.
# SAM ViT-H, box jitter, prompts by area and SAM 3 exemplar boxes are future work.
oracle:
  models: {SAM: [boxes], SAM 2: [points, boxes], MedSAM: [boxes]}
  checkpoints: {SAM: sam_vit_b_01ec64.pth, SAM 2: sam2.1_hiera_large.pt, MedSAM: medsam_vit_b.pth}
  components: 8-connected, on the 1440 canvas ground truth
  k: [1, 5, 20, all]
  curve_sets: [IDRiD, DDR]            # every k; the other five sets get k = all only
  order: "sort by (row, col), then one permutation from PCG64(20261003) spawned per (image, class); smaller k is a prefix"
  box: "tight bounding box, no jitter; the prompt file stores [x0, y0, x1, y1] with x1, y1 exclusive, the decoders receive x1 - 1, y1 - 1 (inclusive pixel indices, the convention of SAM's batched_mask_to_box and of MedSAM's training boxes; registered 2026-10-12 before any oracle run, review fix 6)"
  window_choice: "G1: each prompt (box or point) is decoded in the window that holds its whole component box (x1, y1 exclusive), the one with the largest smallest box-to-edge distance, ties to the first; a box no window holds (wider or taller than the window) goes to the window keeping most of it and is counted in predicted.json n_prompts_box_uncontained (registered 2026-10-14 before any oracle run; the earlier centre-margin rule tied every window of a row near the canvas edge and cut part of the large boxes)"
  point: the component pixel farthest from its boundary (distance transform; ties to the first in row-major order), one positive point
  decode: "one prompt per call; a point keeps the mask with the highest predicted IoU (multimask), a box one mask; all prompts are decoded once and the k maps are prefix maxima"
  medsam: "1024 resize with per-image min-max to [0, 1], box only, sigmoid of the 256 output then bilinear"
  # the same-information reference of 16: the supervised models' own test maps multiplied by the union
  # of the same k boxes, then evaluated; CPU only (bench/e5/same_info.py)
  same_information_reference: [M2MRF, nnU-Net]
