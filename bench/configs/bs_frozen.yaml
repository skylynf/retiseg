# Track B-std, the main retraining table. Written 2026-10-07, before any B1 or
# B-std run read a test split. Revisions after the first BS run may use
# training loss and validation mAUPR only. B1 stays as the second column.
#
# What is shared: data, splits, canvas, augmentation, training amount in
# pixels, checkpoint selection, inference geometry and evaluation.
# What stays per model: loss, optimizer, learning rate, weight decay,
# schedule shape and effective batch, from author_recipe. The schedule runs
# over the B-std step count, not the author's.
experiment: BS
fov_diameter: 1440
eval_protocol: bench/eval/protocol.yaml
label_policy: multilabel
use_fov: true
datasets: [IDRiD, DDR]
splits:
  IDRiD: {train: train, val: val, test: test}
  DDR: {train: train, val: val, test: test}
seeds:
  IDRiD: 3
  DDR: 3
primary_metric: mAUPR

# Training amount. One equivalent epoch is as many patch pixels as there are
# canvas pixels in the training split, so a 224 patch model draws about 18
# times more patches than a 960 patch model for the same epoch. Steps per
# epoch = ceil(ceil(canvas pixels / patch pixels) / effective batch).
# Fixed per dataset after the budget probe (U-Net and M2MRF seed 0 at twice
# this amount, train and validation only): validation mAUPR is smoothed with a
# centred 3-point mean (2 points at the ends), and a dataset doubles only when
# a smoothed peak is at or after 90% of the probe steps. Probe results and the
# rule revisions are written in docs/ops/00_进度.txt.
# Frozen 2026-10-08. IDRiD stays at 1000 (smoothed peaks at 15% and 82%).
# DDR doubles from 200 to 400 (smoothed peaks of both probes at 100%).
equivalent_epochs:
  IDRiD: 1000
  DDR: 400
# Validations per run, spaced in whole epochs. The checkpoint with the highest
# validation mAUPR is scored; the last step is the sensitivity checkpoint.
n_evals: 20
select_by: val_maupr

# Patch geometry. A model whose card sets forward_size trains on patches of
# that size cut from the canvas and predicts with overlapping windows of the
# same size. Every other model trains on fully_conv_patch and predicts on the
# whole canvas.
fully_conv_patch: [960, 960]
window_overlap: 0.5

# Augmentation, the same for every model. Parameters follow the mmseg
# pipeline in the M2MRF and HACDR-Net author configs (ratio_range 0.5-2,
# RandomCrop, RandomFlip, PhotoMetricDistortion), plus 90-degree rotation.
# Padding past the scaled canvas is 0 after normalization, label background.
augment:
  scale_range: [0.5, 2.0]
  hflip: 0.5
  rot90: true
  photometric:
    p: 0.5
    brightness_delta: 32
    contrast_range: [0.5, 1.5]
    saturation_range: [0.5, 1.5]
    hue_delta_degrees: 18

# Recipe revisions after the first B-std runs, one entry per model, each with
# loss_params (merged into the author recipe), reason and date. A revision
# changes the budget signature, so the seed-0 gate refuses later seeds until
# that model's seed 0 is rerun; bench/scripts/retire_runs.py moves the old run
# directories aside (docs/ops/11 section 9).
# U-Net, adopted by the user 2026-10-12 (14 note 21): the registered per-image
# sigmoid Dice with smoothing 1 drove the rare-class channels to zero under
# patch training (DDR test SE 0.000; diagnosed 10-08 from training patches and
# validation only). Dice pooled over the batch per class, smoothing 1e-5, as in
# nnU-Net; the diagnostic runs with exactly these values reached validation
# mAUPR 0.569 (IDRiD) and 0.544 (DDR). The decision came after the registered
# recipe's test numbers had been read; those runs stay as "registered recipe".
recipe_revisions:
  U-Net:
    loss_params: {smooth: 1.0e-5, batch_dice: true}
    reason: "rare-class collapse of the per-image Dice (smooth 1) under patch training; batch Dice, smooth 1e-5 (14 note 21)"
    date: "2026-10-12"
  # SAM2-UNet, 2026-10-17 (docs/paper/14 note 44; the rule bound to the U-Net
  # decision on 2026-10-12, docs/design/15 section 16 item 4): the author's
  # structure loss computes its weighted IoU term per image and class with
  # smoothing 1, the same mechanism; under B-std on DDR the seed-0 validation
  # AUPR of MA stayed at 0.02-0.04 and SE at 0.05-0.10 from the first to the
  # last evaluation (history.jsonl), the two classes with the most empty
  # patches, while HE and EX trained normally. The IoU term is pooled over the
  # batch per class (bench/models/sam2_unet.py structure_loss batch_iou); BCE
  # and deep supervision unchanged. Both sources' seed 0 are rerun; the
  # collapsed runs stay as "registered recipe". The decision follows the
  # validation curves; the test number of the registered run (0.210) had been
  # read by the time it was taken and is disclosed like the U-Net one.
  SAM2-UNet:
    loss_params: {batch_iou: true}
    reason: "rare-class collapse of the per-image weighted IoU (smooth 1) under patch training on DDR; IoU pooled over the batch (14 note 44)"
    date: "2026-10-17"
  # MedSAM, 2026-10-22 (docs/paper/14 note 55; the same rule): the author's monai DiceLoss is
  # per image and class; under B-std on DDR the seed-0 validation AUPR of MA stayed at
  # 0.000-0.004 and SE at 0.002 from the first (epoch 20) to the last (400) evaluation while
  # HE and EX trained (0.60-0.66, 0.37-0.51); test MA 0.0005, SE 0.0006, mAUPR 0.265. The
  # Dice term is pooled over the batch per class (bench/models/medsam.py dice_loss
  # batch_dice; BCE unchanged). Both sources' seed 0 are rerun; the collapsed runs stay as
  # "registered recipe". The test numbers of the registered runs (DDR 0.265, IDRiD 0.584)
  # had been read when the decision was taken and are disclosed like the U-Net ones.
  MedSAM:
    loss_params: {batch_dice: true}
    reason: "rare-class collapse of the per-image Dice (monai, smooth 1e-5) under patch training on DDR; Dice pooled over the batch (14 note 55)"
    date: "2026-10-22"
